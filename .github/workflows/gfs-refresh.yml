name: Refresh GFS Chartink Dashboard

on:
  workflow_dispatch:
  # Weekdays, India market session. GitHub Actions cron is UTC.
  schedule:
    - cron: "45 3 * * 1-5"       # 09:15 IST
    - cron: "*/15 4-9 * * 1-5"  # 09:30-15:15 IST
    - cron: "0 10 * * 1-5"      # 15:30 IST

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run all six Chartink screeners
        run: python gfs_dashboard.py

      - name: Upload latest dashboard (including partial results for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-dashboard-latest
          path: |
            gfs_dashboard_latest.xlsx
            gfs_dashboard_latest.json
          if-no-files-found: warn
          retention-days: 7
